[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "streetpunc-qaftune"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对量化后微调的精度相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "streetpunc" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://streetpunc.github.io"
Repository = "https://github.com/streetpunc/qaftune"
Issues = "https://github.com/streetpunc/qaftune/issues"

[project.scripts]
qaftune = "qaftune:main"

[tool.setuptools]
py-modules = ["qaftune"]
